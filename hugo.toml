baseURL = "https://go-ruby-benchmark.github.io/"
title = "go-ruby-benchmark"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[[params.phases]]
  name = "Tms value type"
  status = "ready"
  blurb = "`Benchmark::Tms`: `utime`, `stime`, `cutime`, `cstime`, `real`, the derived `total = utime+stime+cutime+cstime`, and a `label`, with `ToA` / `ToS` and MRI-exact constructor semantics (a sum's label clears to `\"\"`)."
[[params.phases]]
  name = "Memberwise & scalar arithmetic"
  status = "ready"
  blurb = "`Add` / `Sub` / `Mul` / `Div` against another `Tms`, and the scalar forms applied to all five fields (real included) — exactly as MRI's `Tms#+ - * /` do."
[[params.phases]]
  name = "Format directives"
  status = "ready"
  blurb = "The Benchmark `%`-extensions on top of printf: `%u` user, `%y` system, `%U` / `%Y` children's, `%t` total, `%r` real (parenthesised), `%n` label — each preserving its flag/width/precision run, with `%%` collapse and surplus-arg drop matching `String#%`."
[[params.phases]]
  name = "Report layout"
  status = "ready"
  blurb = "`CAPTION`, label left-justification, and the full `bm(width)`, `bmbm` (rehearsal banner + total footer + take table), and general `benchmark(caption, width, format, *labels)` tables with trailing summary lines — all pure functions over `Tms`."
[[params.phases]]
  name = "Injected clock"
  status = "ready"
  blurb = "`MeasureWith`, `RealtimeWith`, `MsWith`, and `Tms.AddWith` take a `Clock` seam (`Process.times` + `clock_gettime(CLOCK_MONOTONIC)`): the host supplies the real process clock, tests a deterministic one, so every formatted line is reproducible."
[[params.phases]]
  name = "Differential oracle & coverage"
  status = "ready"
  blurb = "The same fixed numbers and a patched, deterministic clock fed to the system `ruby`'s `Benchmark` and compared byte-for-byte; 100% coverage, gofmt + go vet clean, green across all six 64-bit Go arches and three OSes."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 10.02:1, bright on the dark background 4.00:1.
  base = "#7f1d1d"
  deep = "#4d1212"
  bright = "#dc2626"
  shadow = "rgba(127,29,29,.7)"
  glow = "rgba(127,29,29,.6)"
  wash = "rgba(127,29,29,.10)"
  washDeep = "rgba(77,18,18,.06)"
  chipBg = "#fbe5e5"
  chipBorder = "#f4bebe"
  chipFg = "#4d1212"
  chipBgDark = "rgba(220,38,38,.14)"
  chipBorderDark = "rgba(220,38,38,.32)"
  chipFgDark = "#ec8888"
  statsEnd = "#f7cbcb"
  bandText = "#f9dcdc"
